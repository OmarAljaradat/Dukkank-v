kind = "web"
previewPath = "/"
title = "دُكانك - متجر الألعاب الرقمية"
version = "1.0.0"
id = "artifacts/dukkank"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25145

[services.development]
run = "pnpm --filter @workspace/dukkank run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dukkank", "run", "build" ]
publicDir = "artifacts/dukkank/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25145"
BASE_PATH = "/"
